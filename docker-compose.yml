name: agentbenchx
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentbenchx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-agentbenchx}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infrastructure/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentbenchx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentbenchx}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./storage:/app/storage"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build:
      context: apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  redis_data:
