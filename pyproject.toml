[project]
name = "agentbenchx"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20", "httpx>=0.28,<1", "boto3>=1.36,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "."]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis", "nifus: optional real source inspection"]
[tool.ruff]
line-length = 110

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
